<stop offset="0%" stop-color="#6e555d" stop-opacity="0.2"></stop>
<stop offset="100%" stop-color="#6e555d" stop-opacity="0"></stop>
</linearGradient>
</defs>

<line stroke="#ffd9df" stroke-dasharray="4" stroke-width="1" x1="0" x2="800" y1="150" y2="150"></line>
<line stroke="#ffd9df" stroke-dasharray="4" stroke-width="1" x1="0" x2="800" y1="250" y2="250"></line>
<path d="" fill="url(#chart-gradient)" id="trend-area"></path>

</svg>

<script>
requireLogin();
fillAdminName();

async function loadDashboard() {
  try {
    const d = await adminFetch("/admin/dashboard");
    document.getElementById("stat-revenue").textContent = "$" + d.revenue_today.toLocaleString();
    document.getElementById("stat-orders").textContent = d.orders_today;
    document.getElementById("stat-pending").textContent = "待處理: " + d.pending_orders + " 筆";
    document.getElementById("stat-total").textContent = d.total_orders.toLocaleString();
    if (d.best_seller) {
      document.getElementById("best-name").textContent = d.best_seller.product_name;
      document.getElementById("best-qty").textContent = "累計銷量: " + d.best_seller.qty + " 件";
      if (d.best_seller.image) {
        const img = document.getElementById("best-img");
        img.src = ".." + d.best_seller.image;
        img.classList.remove("hidden");
      }
    } else {
      document.getElementById("best-name").textContent = "尚無資料";
    }

    // 趨勢圖
    const values = d.trend.map((t) => t.value);
    const max = Math.max(...values, 1);
    const pts = values.map((v, i) => [
      (i / (values.length - 1)) * 800,
      280 - (v / max) * 250,
    ]);
    const lineD = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
    document.getElementById("trend-line").setAttribute("d", lineD);
    document.getElementById("trend-area").setAttribute("d", lineD + " L800,300 L0,300 Z");
    document.getElementById("trend-labels").innerHTML = d.trend.map((t) => `<span>${t.date}</span>`).join("");

    // 近期訂單
    const box = document.getElementById("recent-orders");
    if (d.recent_orders.length === 0) {
      box.innerHTML = '<p class="text-on-surface-variant">尚無訂單</p>';
    } else {
      box.innerHTML = d.recent_orders.map((o) => `
        <div class="flex items-center justify-between p-3 rounded-lg hover:bg-surface-container-low transition-colors group">
          <div class="flex items-center gap-sm">
            <div class="w-10 h-10 rounded-full bg-secondary-fixed flex items-center justify-center text-on-secondary-fixed font-label-md text-label-md">${o.customer_name.charAt(0)}</div>
            <div>
              <p class="font-body-md text-body-md text-on-surface font-semibold">${o.customer_name}</p>
              <p class="font-caption text-caption text-on-surface-variant">#${o.order_no}</p>
            </div>
          </div>
          <div class="text-right">
            <p class="font-label-md text-label-md text-on-surface">${formatPrice(o.total)}</p>
            ${statusBadge(o.status)}
          </div>
        </div>`).join('<div class="w-full h-px bg-surface-variant"></div>');
    }
  } catch (err) {
    console.error(err);
  }
}
loadDashboard();
</script></body></html>
