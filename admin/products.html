-label-md text-label-md">財務管理</span></a><a class="flex items-center px-md py-sm rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all group" href="users.html"><span class="material-symbols-outlined mr-sm text-secondary">admin_panel_settings</span><span class="font-label-md text-label-md">權限管理</span></a></nav><div class="px-sm"><button class="w-full flex items-center px-md py-sm rounded-lg text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-all" onclick="logout()"><span class="material-symbols-outlined mr-sm text-secondary">logout</span><span class="font-label-md text-label-md">登出</span></button></div></aside><div class="pl-72"><header class="fixed top-0 left-72 right-0 h-20 bg-surface/80 backdrop-blur-xl z-40 flex items-center justify-between px-lg shadow-[0_1px_8px_rgba(0,0,0,0.03)]"><div class="flex items-center gap-xs text-on-surface-variant text-caption"><span>管理系統</span><span class="material-symbols-outlined text-[16px]">chevron_right</span><span class="text-on-surface font-semibold">Product Management</span></div><div class="flex items-center gap-sm pl-md border-l border-outline-variant"><div class="text-right"><p class="font-label-md text-label-md text-on-surface" id="admin-name">管理員</p><p class="text-caption text-on-surface-variant">系統管理員</p></div><div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center shadow-md"><span class="material-symbols-outlined text-on-primary text-[22px]">person</span></div></div></header><main class="relative pt-20 bg-surface min-h-screen"><div class="flex flex-col w-full h-full p-margin-mobile md:p-margin-desktop bg-surface relative overflow-hidden">
<div class="absolute top-0 right-0 w-[500px] h-[500px] bg-primary-fixed opacity-[0.12] blur-[120px] rounded-full pointer-events-none -mt-32 -mr-32"></div>
<!-- Header -->
<div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-xl relative z-10 gap-md">
<div class="flex flex-col gap-xs max-w-2xl">
<h1 class="font-display text-display text-on-surface tracking-tight">產品管理</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant leading-relaxed">
        新增商品與商品照片,管理售價與上下架狀態。上架中的商品會即時顯示於前台「精選商品」頁面。
      </p>
</div>
<button class="flex items-center gap-2 px-6 py-3 rounded-full bg-primary text-on-primary hover:-translate-y-0.5 transition-all duration-300 shadow-sm hover:shadow-md font-label-md shrink-0" onclick="openProductModal()">
<span class="material-symbols-outlined text-[20px]">add_photo_alternate</span>
<span>新增產品</span>
</button>
</div>
<!-- Product Grid -->
<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-md relative z-10" id="prod-grid">
<p class="text-on-surface-variant col-span-full">載入中...</p>
</div>
</div></main></div>
<!-- 新增/編輯產品 Modal -->
<div class="hidden fixed inset-0 z-[100] bg-inverse-surface/40 backdrop-blur-sm items-center justify-center p-md" id="prod-modal">
<div class="bg-surface rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-lg space-y-md">
<div class="flex justify-between items-start">
<h2 class="font-headline-md text-headline-md text-on-surface" id="prod-modal-title">新增產品</h2>
<button class="text-on-surface-variant hover:text-error p-1" onclick="closeProductModal()"><span class="material-symbols-outlined">close</span></button>
</div>
<form class="space-y-sm" id="prod-form">
<input id="prod-id" type="hidden"/>
<!-- 圖片上傳與預覽 -->
<div>
<label class="font-label-md text-on-surface block mb-1">商品照片</label>
<label class="block w-full aspect-[16/9] rounded-xl bg-surface-container-low ring-1 ring-tertiary-fixed hover:ring-primary cursor-pointer overflow-hidden relative transition-all" for="prod-image">
<img class="hidden w-full h-full object-cover" id="prod-preview"/>
<div class="absolute inset-0 flex flex-col items-center justify-center gap-xs text-on-surface-variant" id="prod-placeholder">
<span class="material-symbols-outlined text-4xl">add_photo_alternate</span>
<span class="font-caption">點擊選擇圖片 (jpg / png / webp)</span>
</div>
</label>
<input accept="image/jpeg,image/png,image/webp,image/gif" class="hidden" id="prod-image" type="file"/>
</div>
<div><label class="font-label-md text-on-surface block mb-1">商品名稱 *</label>
<input class="w-full bg-surface-container-low px-4 py-3 rounded-lg ring-1 ring-tertiary-fixed focus:ring-2 focus:ring-primary outline-none" id="prod-name" required type="text"/></div>
<div><label class="font-label-md text-on-surface block mb-1">商品描述</label>
<textarea class="w-full bg-surface-container-low px-4 py-3 rounded-lg ring-1 ring-tertiary-fixed focus:ring-2 focus:ring-primary outline-none" id="prod-desc" rows="3"></textarea></div>
<div class="grid grid-cols-2 gap-sm">
<div><label class="font-label-md text-on-surface block mb-1">售價 (NT$) *</label>
<input class="w-full bg-surface-container-low px-4 py-3 rounded-lg ring-1 ring-tertiary-fixed focus:ring-2 focus:ring-primary outline-none" id="prod-price" min="0" required type="number"/></div>
<div><label class="font-label-md text-on-surface block mb-1">規格</label>
<input class="w-full bg-surface-container-low px-4 py-3 rounded-lg ring-1 ring-tertiary-fixed focus:ring-2 focus:ring-primary outline-none" id="prod-spec" placeholder="6入裝" type="text"/></div>
</div>
<div class="grid grid-cols-2 gap-sm">
<div><label class="font-label-md text-on-surface block mb-1">分類</label>
<select class="w-full bg-surface-container-low px-4 py-3 rounded-lg ring-1 ring-tertiary-fixed focus:ring-2 focus:ring-primary outline-none" id="prod-category">
<option>蛋黃酥系列</option><option>鳳梨酥系列</option><option>節慶禮盒</option><option>其他</option>
</select></div>
<div><label class="font-label-md text-on-surface block mb-1">標籤 (選填)</label>
<input class="w-full bg-surface-container-low px-4 py-3 rounded-lg ring-1 ring-tertiary-fixed focus:ring-2 focus:ring-primary outline-none" id="prod-tag" placeholder="新品上市" type="text"/></div>
</div>
<label class="flex items-center gap-sm py-2 cursor-pointer">
<input checked class="accent-primary w-5 h-5" id="prod-active" type="checkbox"/>
<span class="font-body-md text-on-surface">立即上架 (前台可見)</span>
</label>
<p class="hidden text-error font-body-md" id="prod-error"></p>
<button class="w-full py-3 bg-primary text-on-primary font-label-md rounded-full shadow-md hover:shadow-lg transition-all" type="submit">儲存</button>
</form>
</div>
</div>
<script>
requireLogin();
fillAdminName();

let allProducts = [];

/* multipart 上傳 (不可帶 JSON Content-Type) */
async function adminUpload(path, formData) {
  const res = await fetch(API_BASE + path, {
    method: "POST",
    headers: { Authorization: "Bearer " + getToken() },
    body: formData,
  });
  if (res.status === 401) { logout(); throw new Error("登入逾期"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "API 錯誤");
  return data;
}

function renderProducts() {
  document.getElementById("prod-grid").innerHTML = allProducts.map((p) => `
    <article class="bg-surface-container-lowest rounded-2xl overflow-hidden flex flex-col shadow-[0_4px_24px_rgba(157,129,137,0.06)] border border-outline-variant/20 ${p.is_active ? "" : "opacity-70"}">
      <div class="relative w-full aspect-[16/10] overflow-hidden bg-surface-container">
        ${p.image
          ? `<img alt="${p.name}" class="w-full h-full object-cover ${p.is_active ? "" : "grayscale"}" src="..${p.image}"/>`
          : '<div class="w-full h-full flex items-center justify-center text-outline-variant"><span class="material-symbols-outlined text-5xl">bakery_dining</span></div>'}
        <div class="absolute top-3 left-3 flex gap-2">
          ${p.is_active
            ? '<span class="bg-tertiary-container text-on-tertiary font-caption px-3 py-1 rounded-full">上架中</span>'
            : '<span class="bg-error-container text-on-error-container font-caption px-3 py-1 rounded-full">已下架</span>'}
          ${p.tag ? `<span class="bg-surface/90 text-secondary font-caption px-3 py-1 rounded-full backdrop-blur-sm">${p.tag}</span>` : ""}
        </div>
      </div>
      <div class="p-md flex flex-col flex-grow gap-xs">
        <div class="flex justify-between items-start">
          <h2 class="font-headline-md text-headline-md text-on-surface">${p.name}</h2>
          <span class="font-headline-md text-primary whitespace-nowrap">NT$ ${p.price.toLocaleString()}</span>
        </div>
        <p class="font-caption text-on-surface-variant">${p.category} · ${p.spec || "-"} · 材料成本約 NT$ ${p.material_cost}</p>
        <p class="font-body-md text-on-surface-variant line-clamp-2 flex-grow">${p.description || ""}</p>
        <div class="flex items-center justify-between mt-sm pt-sm border-t border-outline-variant/20">
          <label class="flex items-center gap-sm cursor-pointer select-none">
            <span class="relative inline-block w-11 h-6">
              <input class="peer sr-only toggle-active" data-id="${p.id}" type="checkbox" ${p.is_active ? "checked" : ""}/>
              <span class="absolute inset-0 rounded-full bg-surface-variant peer-checked:bg-primary transition-colors"></span>
              <span class="absolute top-0.5 left-0.5 w-5 h-5 rounded-full bg-white shadow peer-checked:translate-x-5 transition-transform"></span>
            </span>
            <span class="font-label-md text-on-surface-variant">${p.is_active ? "上架" : "下架"}</span>
          </label>
          <button class="flex items-center gap-1 text-primary hover:text-on-primary-fixed-variant font-label-md transition-colors" onclick="openProductModal(${p.id})">
            <span class="material-symbols-outlined text-[18px]">edit</span> 編輯
          </button>
        </div>
      </div>
    </article>`).join("");
  document.querySelectorAll(".toggle-active").forEach((sw) => {
    sw.addEventListener("change", async () => {
      try {
        await adminFetch(`/admin/products/${sw.dataset.id}/active`, {
          method: "PATCH",
          body: JSON.stringify({ is_active: sw.checked }),
        });
        loadProducts();
      } catch (err) { alert(err.message); sw.checked = !sw.checked; }
    });
  });
}

async function loadProducts() {
  try {
    const d = await adminFetch("/admin/products");
    allProducts = d.products;
    renderProducts();
  } catch (err) {
    document.getElementById("prod-grid").innerHTML =
      `<p class="text-error col-span-full">無法載入商品:${err.message}</p>`;
  }
}

function openProductModal(id) {
  const p = allProducts.find((x) => x.id === id);
  document.getElementById("prod-modal-title").textContent = p ? "編輯產品" : "新增產品";
  document.getElementById("prod-id").value = p ? p.id : "";
  document.getElementById("prod-name").value = p ? p.name : "";
  document.getElementById("prod-desc").value = p ? p.description : "";
  document.getElementById("prod-price").value = p ? p.price : "";
  document.getElementById("prod-spec").value = p ? p.spec : "";
  document.getElementById("prod-category").value = p ? p.category : "蛋黃酥系列";
  document.getElementById("prod-tag").value = p ? p.tag : "";
  document.getElementById("prod-active").checked = p ? !!p.is_active : true;
  document.getElementById("prod-image").value = "";
  const preview = document.getElementById("prod-preview");
  const placeholder = document.getElementById("prod-placeholder");
  if (p && p.image) {
    preview.src = ".." + p.image;
    preview.classList.remove("hidden");
    placeholder.classList.add("hidden");
  } else {
    preview.classList.add("hidden");
    placeholder.classList.remove("hidden");
  }
  document.getElementById("prod-error").classList.add("hidden");
  const modal = document.getElementById("prod-modal");
  modal.classList.remove("hidden"); modal.classList.add("flex");
}
function closeProductModal() {
  const modal = document.getElementById("prod-modal");
  modal.classList.add("hidden"); modal.classList.remove("flex");
}

document.getElementById("prod-image").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const preview = document.getElementById("prod-preview");
  preview.src = URL.createObjectURL(file);
  preview.classList.remove("hidden");
  document.getElementById("prod-placeholder").classList.add("hidden");
});

document.getElementById("prod-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = document.getElementById("prod-id").value;
  const fd = new FormData();
  fd.append("name", document.getElementById("prod-name").value);
  fd.append("description", document.getElementById("prod-desc").value);
  fd.append("price", document.getElementById("prod-price").value);
  fd.append("spec", document.getElementById("prod-spec").value);
  fd.append("category", document.getElementById("prod-category").value);
  fd.append("tag", document.getElementById("prod-tag").value);
  fd.append("is_active", document.getElementById("prod-active").checked ? "1" : "0");
  const file = document.getElementById("prod-image").files[0];
  if (file) fd.append("image", file);
  try {
    if (id) await adminUpload(`/admin/products/${id}/update`, fd);
    else await adminUpload("/admin/products", fd);
    closeProductModal();
    loadProducts();
  } catch (err) {
    const el = document.getElementById("prod-error");
    el.textContent = err.message; el.classList.remove("hidden");
  }
});

document.getElementById("prod-modal").addEventListener("click", (e) => {
  if (e.target === e.currentTarget) closeProductModal();
});

loadProducts();
</script></body></html>
