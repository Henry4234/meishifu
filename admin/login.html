<script defer src="js/admin-anim.js"></script></head><body class="bg-background font-body-md text-on-surface flex items-center justify-center min-h-screen"><main class="w-full max-w-md p-lg"><div class="flex flex-col w-full flex-grow relative overflow-hidden bg-background">
<div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 bg-primary-container rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse" style="animation-duration: 8s;"></div>
<div class="absolute bottom-0 left-0 -ml-20 -mb-20 w-[30rem] h-[30rem] bg-secondary-container rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-pulse" style="animation-duration: 10s; animation-delay: 2s;"></div>
<div class="relative z-10 flex flex-col items-center justify-center flex-grow p-gutter">
<div class="w-full max-w-[420px] bg-surface rounded-xl shadow-xl overflow-hidden transition-all duration-300 hover:shadow-2xl flex flex-col" style="box-shadow: 0 10px 40px -10px rgba(157, 129, 137, 0.08);">
<div class="p-10 flex flex-col items-center">
<div class="w-32 h-32 mb-8 rounded-full overflow-hidden shadow-sm flex-shrink-0 bg-surface-container-lowest flex items-center justify-center">
<img alt="美師傅 Logo" class="w-full h-full object-contain" src="../assets/logo.png"/>
</div>
<div class="text-center w-full mb-8">
<h1 class="text-headline-lg font-headline-lg text-primary mb-2">後台管理</h1>
<p class="text-body-md font-body-md text-on-surface-variant tracking-wide">歡迎回來,請登入以繼續操作</p>
</div>
<form class="w-full flex flex-col gap-6" id="loginForm">
<div class="flex flex-col gap-4">
<div class="relative flex flex-col group">
<label class="text-label-md font-label-md text-primary mb-1 pl-1 transition-colors group-focus-within:text-secondary" for="username">帳號</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant/50 transition-colors group-focus-within:text-primary">person</span>
<input class="w-full bg-surface-container-low text-on-surface text-body-md font-body-md py-4 pl-12 pr-4 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 placeholder-on-surface-variant/40" id="username" name="username" placeholder="請輸入帳號" required style="box-shadow: inset 0 0 0 1px #D8E2DC;" type="text"/>
</div>
</div>
<div class="relative flex flex-col group">
<label class="text-label-md font-label-md text-primary mb-1 pl-1 transition-colors group-focus-within:text-secondary" for="password">密碼</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant/50 transition-colors group-focus-within:text-primary">lock</span>
<input class="w-full bg-surface-container-low text-on-surface text-body-md font-body-md py-4 pl-12 pr-12 rounded-lg focus:outline-none focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 placeholder-on-surface-variant/40" id="password" name="password" placeholder="請輸入密碼" required style="box-shadow: inset 0 0 0 1px #D8E2DC;" type="password"/>
<button aria-label="顯示/隱藏密碼" class="absolute right-4 text-on-surface-variant/50 hover:text-primary transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="visibilityIcon">visibility_off</span>
</button>
</div>
</div>
</div>
<p class="hidden text-body-md text-error text-center" id="login-error"></p>
<button class="w-full bg-primary text-on-primary text-label-md font-label-md py-4 rounded-lg mt-2 shadow-md hover:shadow-lg transition-all duration-200 transform hover:scale-[1.02] flex items-center justify-center gap-2" id="loginBtn" type="submit">
<span>登入系統</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<div class="h-2 w-full bg-gradient-to-r from-primary/80 via-secondary/80 to-tertiary/80"></div>
</div>
<div class="mt-8 text-center flex flex-col items-center gap-2 opacity-60">
<span class="text-caption font-caption text-on-surface-variant tracking-[0.1em]">THE BEAUTY OF THE MAKER</span>
<span class="text-caption font-caption text-on-surface-variant">© 2026 美師傅 Meishifu.</span>
</div>
</div>
</div></main>
<script>
document.getElementById("togglePassword").addEventListener("click", () => {
  const input = document.getElementById("password");
  const icon = document.getElementById("visibilityIcon");
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  icon.textContent = show ? "visibility" : "visibility_off";
});

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const errEl = document.getElementById("login-error");
  errEl.classList.add("hidden");
  btn.classList.add("opacity-75", "cursor-wait");
  try {
    const res = await fetch(API_BASE + "/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "登入失敗");
    localStorage.setItem(TOKEN_KEY, data.token);
    localStorage.setItem(ADMIN_NAME_KEY, data.display_name);
    window.location.href = "dashboard.html";
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove("hidden");
  } finally {
    btn.classList.remove("opacity-75", "cursor-wait");
  }
});
</script></body></html>
