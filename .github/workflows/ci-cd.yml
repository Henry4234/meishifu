name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  frontend-test:
    name: Frontend tests (coverage >= 70%)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run frontend tests and enforce coverage
        run: |
          mkdir -p frontend/coverage
          node \
            --test \
            --experimental-test-coverage \
            --test-coverage-lines=70 \
            --test-coverage-include='frontend/js/site.js' \
            --test-reporter=spec \
            --test-reporter=lcov \
            --test-reporter-destination=stdout \
            --test-reporter-destination=frontend/coverage/lcov.info \
            frontend/tests/site.test.js

      - name: Read frontend coverage percentage
        id: coverage
        run: |
          percentage="$(awk -F: '/^LF:/{lines+=$2} /^LH:/{hits+=$2} END { if (!lines) exit 1; printf "%.2f", hits * 100 / lines }' frontend/coverage/lcov.info)"
          echo "percentage=${percentage}" >> "${GITHUB_OUTPUT}"
          echo "Frontend coverage: ${percentage}%"

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-${{ github.sha }}
          path: frontend/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  admin-test:
    name: Admin tests (coverage >= 70%)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run admin tests and enforce coverage
        run: |
          mkdir -p admin/coverage
          node \
            --test \
            --experimental-test-coverage \
            --test-coverage-lines=70 \
            --test-coverage-include='admin/js/admin.js' \
            --test-reporter=spec \
            --test-reporter=lcov \
            --test-reporter-destination=stdout \
            --test-reporter-destination=admin/coverage/lcov.info \
            admin/tests/admin.test.js

      - name: Read admin coverage percentage
        id: coverage
        run: |
          percentage="$(awk -F: '/^LF:/{lines+=$2} /^LH:/{hits+=$2} END { if (!lines) exit 1; printf "%.2f", hits * 100 / lines }' admin/coverage/lcov.info)"
          echo "percentage=${percentage}" >> "${GITHUB_OUTPUT}"
          echo "Admin coverage: ${percentage}%"

      - name: Upload admin coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: admin-coverage-${{ github.sha }}
          path: admin/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  backend-test:
    name: Backend tests (coverage >= 70%)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      coverage: ${{ steps.coverage.outputs.percentage }}
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --dev

      - name: Validate backend startup script
        run: bash -n start-with-tailscale.sh

      - name: Run backend tests and enforce coverage
        run: >-
          uv run pytest
          --cov=.
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
          --cov-fail-under=70

      - name: Read backend coverage percentage
        id: coverage
        run: |
          percentage="$(python -c 'import json; print("%.2f" % json.load(open("coverage.json"))["totals"]["percent_covered"])')"
          echo "percentage=${percentage}" >> "${GITHUB_OUTPUT}"
          echo "Backend coverage: ${percentage}%"

      - name: Upload backend coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-${{ github.sha }}
          path: |
            backend/coverage.xml
            backend/coverage.json
          if-no-files-found: warn
          retention-days: 14

  coverage-report:
    name: Container coverage report
    if: always()
    needs: [frontend-test, admin-test, backend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create consolidated coverage report
        env:
          FRONTEND_COVERAGE: ${{ needs.frontend-test.outputs.coverage }}
          ADMIN_COVERAGE: ${{ needs.admin-test.outputs.coverage }}
          BACKEND_COVERAGE: ${{ needs.backend-test.outputs.coverage }}
          FRONTEND_RESULT: ${{ needs.frontend-test.result }}
          ADMIN_RESULT: ${{ needs.admin-test.result }}
          BACKEND_RESULT: ${{ needs.backend-test.result }}
        run: |
          mkdir -p coverage-summary
          frontend_coverage="${FRONTEND_COVERAGE:-N/A}"
          admin_coverage="${ADMIN_COVERAGE:-N/A}"
          backend_coverage="${BACKEND_COVERAGE:-N/A}"

          {
            echo "# Container coverage report"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo "| Container | Coverage | Required | Test result |"
            echo "|---|---:|---:|---|"
            echo "| frontend | ${frontend_coverage}% | 70% | ${FRONTEND_RESULT} |"
            echo "| admin | ${admin_coverage}% | 70% | ${ADMIN_RESULT} |"
            echo "| backend | ${backend_coverage}% | 70% | ${BACKEND_RESULT} |"
          } | tee coverage-summary/coverage-summary.md

          cat coverage-summary/coverage-summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload consolidated coverage report
        uses: actions/upload-artifact@v7
        with:
          name: container-coverage-summary-${{ github.sha }}
          path: coverage-summary/coverage-summary.md
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to GCP Cloud Run
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [frontend-test, admin-test, backend-test, coverage-report]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate GCP federation variables
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "${WIF_PROVIDER}" || { echo "Missing GCP_WORKLOAD_IDENTITY_PROVIDER repository variable" >&2; exit 1; }
          test -n "${DEPLOYER_SERVICE_ACCOUNT}" || { echo "Missing GCP_SERVICE_ACCOUNT repository variable" >&2; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: meishifu
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: meishifu

      - name: Validate ECPay deployment configuration
        env:
          ECPAY_ENV: production
          ECPAY_MERCHANT_ID: "3511953"
          # 正式 main 部署使用綠界正式物流；其他 branch 維持測試環境。
          # 環境與 MerchantID 必須成對切換，避免正式 endpoint 誤用測試特店。
          ECPAY_LOGISTICS_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'stage' }}
          ECPAY_LOGISTICS_MERCHANT_ID: ${{ github.ref == 'refs/heads/main' && '3511953' || '2000933' }}
          ECPAY_HASH_KEY_SECRET: meishifu-ecpay-hash-key
          ECPAY_HASH_IV_SECRET: meishifu-ecpay-hash-iv
          BACKEND_BASE_URL: https://meishifu-backend-729707774647.asia-east1.run.app
          FRONTEND_BASE_URL: https://meishifu.org
        run: |
          test "${ECPAY_ENV}" = "production" || { echo "ECPAY_ENV must be production" >&2; exit 1; }
          test -n "${ECPAY_MERCHANT_ID}" || { echo "Missing ECPAY_MERCHANT_ID" >&2; exit 1; }
          expected_logistics_env="stage"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            expected_logistics_env="production"
          fi
          test "${ECPAY_LOGISTICS_ENV}" = "${expected_logistics_env}" || { echo "ECPAY_LOGISTICS_ENV must be ${expected_logistics_env} on ${GITHUB_REF}" >&2; exit 1; }
          case "${ECPAY_LOGISTICS_ENV}" in
            stage|production) ;;
            *) echo "ECPAY_LOGISTICS_ENV must be stage or production" >&2; exit 1 ;;
          esac
          if [ "${ECPAY_LOGISTICS_ENV}" = "production" ] && [ "${ECPAY_LOGISTICS_MERCHANT_ID}" = "2000933" ]; then
            echo "Production logistics must use the seller's ECPay member ID, not test merchant 2000933" >&2
            exit 1
          fi
          test -n "${ECPAY_HASH_KEY_SECRET}" || { echo "Missing ECPAY_HASH_KEY_SECRET" >&2; exit 1; }
          test -n "${ECPAY_HASH_IV_SECRET}" || { echo "Missing ECPAY_HASH_IV_SECRET" >&2; exit 1; }
          test "${BACKEND_BASE_URL}" = "https://meishifu-backend-729707774647.asia-east1.run.app" || { echo "Unexpected BACKEND_BASE_URL" >&2; exit 1; }
          test "${FRONTEND_BASE_URL}" = "https://meishifu.org" || { echo "Unexpected FRONTEND_BASE_URL" >&2; exit 1; }

      - name: Capture currently serving revisions
        id: previous_revisions
        env:
          PROJECT_ID: meishifu
          REGION: asia-east1
        run: |
          capture_revision() {
            local output_name="$1"
            local service="$2"
            local revision
            local percent

            read -r revision percent <<< "$(gcloud run services describe "${service}" \
              --project "${PROJECT_ID}" \
              --region "${REGION}" \
              --format='value(status.traffic[0].revisionName,status.traffic[0].percent)')"

            test -n "${revision}" || { echo "No serving revision found for ${service}" >&2; exit 1; }
            test "${percent}" = "100" || { echo "${service} does not have a single 100% traffic revision" >&2; exit 1; }
            echo "${output_name}=${revision}" >> "${GITHUB_OUTPUT}"
            echo "Captured ${service}: ${revision}"
          }

          capture_revision backend_revision meishifu-backend
          capture_revision frontend_revision meishifu-frontend
          capture_revision admin_revision meishifu-admin

      - name: Build, push, and deploy immutable revision
        id: deploy_services
        env:
          PROJECT_ID: meishifu
          PROJECT_NUMBER: "729707774647"
          REGION: asia-east1
          TAG: ${{ github.sha }}
          ECPAY_ENV: production
          ECPAY_MERCHANT_ID: "3511953"
          ECPAY_LOGISTICS_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'stage' }}
          ECPAY_LOGISTICS_MERCHANT_ID: ${{ github.ref == 'refs/heads/main' && '3511953' || '2000933' }}
          ECPAY_HASH_KEY_SECRET: meishifu-ecpay-hash-key
          ECPAY_HASH_IV_SECRET: meishifu-ecpay-hash-iv
          BACKEND_BASE_URL: https://meishifu-backend-729707774647.asia-east1.run.app
          FRONTEND_BASE_URL: https://meishifu.org
        run: bash deploy/gcp/deploy-ci.sh

      - name: Smoke test deployed services
        id: smoke_tests
        env:
          PROJECT_ID: meishifu
          REGION: asia-east1
        run: bash deploy/gcp/smoke-test-ci.sh

      - name: Roll back Cloud Run traffic after failure
        if: ${{ failure() && steps.previous_revisions.outcome == 'success' && steps.deploy_services.outputs.services_may_have_changed == 'true' }}
        env:
          PROJECT_ID: meishifu
          REGION: asia-east1
          PREVIOUS_BACKEND_REVISION: ${{ steps.previous_revisions.outputs.backend_revision }}
          PREVIOUS_FRONTEND_REVISION: ${{ steps.previous_revisions.outputs.frontend_revision }}
          PREVIOUS_ADMIN_REVISION: ${{ steps.previous_revisions.outputs.admin_revision }}
        run: bash deploy/gcp/rollback-ci.sh
