<div class="grid grid-cols-12 gap-gutter w-full max-w-7xl mx-auto py-lg px-margin-mobile" id="cart-view">
<!-- Left Panel: Cart Summary -->
<div class="col-span-12 md:col-span-7 flex flex-col gap-8">
<div class="flex flex-col gap-2">

<p class="font-body-md text-body-md text-on-surface-variant">在結帳前確認您選擇的商品。</p>
</div>

<div class="mt-4 flex flex-row items-center justify-between p-4 bg-surface-container-low rounded-lg">
<div class="flex flex-row items-center gap-2">
<span class="material-symbols-outlined text-primary">local_shipping</span>
<span class="font-body-md text-body-md text-on-surface">滿 NT$ 2,000 享免運費</span>
</div>
</div>
</div>
<!-- Right Panel: Checkout Form & Summary -->
<div class="col-span-12 md:col-span-5 flex flex-col gap-6 relative z-10">
<div class="sticky top-24 flex flex-col gap-8 bg-surface-container-lowest p-8 rounded-2xl shadow-xl">
<h2 class="font-headline-lg text-headline-lg text-on-surface">結帳詳情</h2>
<form class="flex flex-col gap-6" id="checkout-form">
<div class="flex flex-col gap-4">
<h3 class="font-label-md text-label-md text-primary uppercase tracking-wider">收件人資訊</h3>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="fullName">姓名</label>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary transition-shadow ring-1 ring-tertiary-fixed" id="fullName" placeholder="王小明" required type="text"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="phone">電話號碼</label>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary transition-shadow ring-1 ring-tertiary-fixed" id="phone" placeholder="0912-345-678" required type="tel"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="address">收件地址</label>
<input class="w-full bg-surface-container-low text-on-surface font-body-md text-body-md px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary transition-shadow ring-1 ring-tertiary-fixed" id="address" placeholder="台北市信義區..." type="text"/>
</div>
</div>
<div class="h-px w-full bg-surface-variant my-2"></div>
<div class="flex flex-col gap-4">
<h3 class="font-label-md text-label-md text-primary uppercase tracking-wider">配送方式</h3>
<div class="grid grid-cols-2 gap-4">
<label class="option-card flex flex-col items-center justify-center gap-2 p-4 bg-surface-container-low rounded-lg cursor-pointer transition-all hover:bg-surface-container ring-2 ring-primary">
<input checked class="sr-only" name="shipping" type="radio" value="delivery"/>
<span class="material-symbols-outlined text-primary text-[32px]">local_shipping</span>
<span class="font-label-md text-label-md text-on-surface">宅配到府</span>
</label>
<label class="option-card flex flex-col items-center justify-center gap-2 p-4 bg-surface-container-low rounded-lg cursor-pointer transition-all hover:bg-surface-container ring-1 ring-tertiary-fixed">
<input class="sr-only" name="shipping" type="radio" value="pickup"/>
<span class="material-symbols-outlined text-tertiary text-[32px]">storefront</span>
<span class="font-label-md text-label-md text-on-surface">門市自取</span>
</label>
</div>
</div>
<div class="h-px w-full bg-surface-variant my-2"></div>
<div class="flex flex-col gap-4">
<h3 class="font-label-md text-label-md text-primary uppercase tracking-wider">付款方式</h3>
<div class="grid grid-cols-2 gap-4">
<label class="option-card flex flex-col items-center justify-center gap-2 p-4 bg-surface-container-low rounded-lg cursor-pointer transition-all hover:bg-surface-container ring-2 ring-primary">
<input checked class="sr-only" name="payment" type="radio" value="credit"/>
<span class="material-symbols-outlined text-primary text-[32px]">credit_card</span>
<span class="font-label-md text-label-md text-on-surface">信用卡</span>
</label>
<label class="option-card flex flex-col items-center justify-center gap-2 p-4 bg-surface-container-low rounded-lg cursor-pointer transition-all hover:bg-surface-container ring-1 ring-tertiary-fixed">
<input class="sr-only" name="payment" type="radio" value="transfer"/>
<span class="material-symbols-outlined text-tertiary text-[32px]">account_balance</span>
<span class="font-label-md text-label-md text-on-surface">銀行轉帳</span>
</label>
</div>
</div>
<div class="h-px w-full bg-surface-variant my-2"></div>
<div class="flex flex-col gap-3">
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">小計</span>
<span class="font-body-md text-body-md text-on-surface" id="subtotal">NT$ 0</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-md text-body-md text-on-surface-variant">運費</span>
<span class="font-body-md text-body-md text-on-surface" id="shipping-fee">NT$ 0</span>
</div>
<div class="flex justify-between items-center pt-3 border-t border-surface-variant">
<span class="font-headline-md text-headline-md text-on-surface">總計</span>
<span class="font-headline-lg text-headline-lg text-primary" id="total">NT$ 0</span>
</div>
</div>
<p class="hidden font-body-md text-error" id="checkout-error"></p>
<button class="w-full py-4 mt-4 bg-primary text-on-primary font-label-md text-label-md rounded-full shadow-md hover:shadow-lg hover:scale-[1.02] transition-all duration-300 flex items-center justify-center gap-2" id="submit-btn" type="submit">
<span class="material-symbols-outlined">lock</span>
            立即安全結帳
          </button>
</form>
</div>
</div>
</div>
<!-- 訂單完成畫面 -->
<div class="hidden max-w-2xl mx-auto py-xl px-margin-mobile text-center flex-col items-center gap-md" id="success-view">
<div class="w-20 h-20 bg-primary-fixed rounded-full flex items-center justify-center mx-auto mb-md">
<span class="material-symbols-outlined text-on-primary-fixed text-4xl">check_circle</span>
</div>
<h1 class="font-display text-display text-on-surface mb-sm">訂單已成立!</h1>
<p class="font-body-lg text-on-surface-variant mb-md">感謝您的訂購,我們將盡快為您安排出貨。</p>
<div class="bg-surface-container-lowest rounded-2xl shadow-md p-lg text-left space-y-sm mx-auto max-w-md">
<div class="flex justify-between"><span class="text-on-surface-variant">訂單編號</span><span class="font-label-md text-primary" id="result-order-no"></span></div>
<div class="flex justify-between"><span class="text-on-surface-variant">小計</span><span id="result-subtotal"></span></div>
<div class="flex justify-between"><span class="text-on-surface-variant">運費</span><span id="result-shipping"></span></div>
<div class="flex justify-between border-t border-surface-variant pt-sm"><span class="font-headline-md">總計</span><span class="font-headline-md text-primary" id="result-total"></span></div>
</div>
<p class="font-caption text-on-surface-variant mt-md" id="payment-note"></p>
<div class="flex gap-md justify-center mt-md">
<button class="hidden px-8 py-3 bg-secondary text-on-secondary rounded-full font-label-md hover:shadow-lg transition-all" id="mock-pay-btn">模擬完成付款 (開發用)</button>
<a class="px-8 py-3 bg-primary text-on-primary rounded-full font-label-md hover:shadow-lg transition-all" href="products.html">繼續購物</a>
</div>
</div>
</main>
<script>
function renderCart() {
  const cart = getCart();
  const box = document.getElementById("cart-items");
  if (cart.length === 0) {
    box.innerHTML = `
      <div class="p-8 bg-surface-container rounded-xl text-center space-y-md">
        <span class="material-symbols-outlined text-outline text-5xl">shopping_cart</span>
        <p class="font-body-lg text-on-surface-variant">購物車目前是空的</p>
        <a class="inline-block px-6 py-3 bg-primary text-on-primary rounded-full font-label-md" href="products.html">前往選購</a>
      </div>`;
  } else {
    box.innerHTML = cart.map((i) => `
      <div class="flex flex-row items-center gap-6 p-6 bg-surface-container rounded-xl shadow-sm hover:shadow-md transition-shadow duration-300">
        <div class="w-32 h-32 rounded-lg bg-cover bg-center overflow-hidden flex-shrink-0" style="background-image: url('..${i.image}')"></div>
        <div class="flex flex-col flex-grow gap-2">
          <div class="flex flex-row justify-between items-start w-full">
            <h3 class="font-headline-md text-headline-md text-on-surface">${i.name}</h3>
            <button aria-label="移除商品" class="remove-btn text-on-surface-variant hover:text-error transition-colors p-2" data-id="${i.product_id}">
              <span class="material-symbols-outlined pointer-events-none">close</span>
            </button>
          </div>
          <p class="font-body-md text-body-md text-on-surface-variant line-clamp-1">${i.spec || ""}</p>
          <div class="flex flex-row justify-between items-end mt-4">
            <div class="flex flex-row items-center bg-surface rounded-full shadow-sm p-1">
              <button aria-label="減少數量" class="qty-btn w-8 h-8 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors rounded-full" data-delta="-1" data-id="${i.product_id}">
                <span class="material-symbols-outlined text-[20px] pointer-events-none">remove</span>
              </button>
              <span class="font-label-md text-label-md text-on-surface w-8 text-center">${i.quantity}</span>
              <button aria-label="增加數量" class="qty-btn w-8 h-8 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors rounded-full" data-delta="1" data-id="${i.product_id}">
                <span class="material-symbols-outlined text-[20px] pointer-events-none">add</span>
              </button>
            </div>
            <span class="font-headline-md text-headline-md text-on-surface">${formatPrice(i.price * i.quantity)}</span>
          </div>
        </div>
      </div>`).join("");
    box.querySelectorAll(".qty-btn").forEach((btn) => btn.addEventListener("click", () => {
      const cart = getCart();
      const item = cart.find((x) => x.product_id === Number(btn.dataset.id));
      if (item) setQuantity(item.product_id, item.quantity + Number(btn.dataset.delta));
      renderCart();
    }));
    box.querySelectorAll(".remove-btn").forEach((btn) => btn.addEventListener("click", () => {
      removeFromCart(Number(btn.dataset.id));
      renderCart();
    }));
  }
  updateTotals();
}

function shippingMethod() { return document.querySelector('input[name="shipping"]:checked').value; }
function paymentMethod() { return document.querySelector('input[name="payment"]:checked').value; }

function updateTotals() {
  const cart = getCart();
  const subtotal = cart.reduce((s, i) => s + i.price * i.quantity, 0);
  const fee = shippingMethod() === "delivery" && subtotal > 0 && subtotal < 2000 ? 120 : 0;
  document.getElementById("subtotal").textContent = formatPrice(subtotal);
  document.getElementById("shipping-fee").textContent = formatPrice(fee);
  document.getElementById("total").textContent = formatPrice(subtotal + fee);
}

// 選項卡片視覺狀態
document.querySelectorAll('input[type="radio"]').forEach((radio) => {
  radio.addEventListener("change", () => {
    document.querySelectorAll(`input[name="${radio.name}"]`).forEach((r) => {
      const card = r.closest(".option-card");
      const icon = card.querySelector(".material-symbols-outlined");
      card.classList.toggle("ring-2", r.checked);
      card.classList.toggle("ring-primary", r.checked);
      card.classList.toggle("ring-1", !r.checked);
      card.classList.toggle("ring-tertiary-fixed", !r.checked);
      icon.classList.toggle("text-primary", r.checked);
      icon.classList.toggle("text-tertiary", !r.checked);
    });
    updateTotals();
  });
});

document.getElementById("checkout-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errEl = document.getElementById("checkout-error");
  errEl.classList.add("hidden");
  const cart = getCart();
  if (cart.length === 0) {
    errEl.textContent = "購物車是空的,請先選購商品。";
    errEl.classList.remove("hidden");
    return;
  }
  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.classList.add("opacity-75");
  try {
    const result = await apiPost("/orders", {
      customer: {
        name: document.getElementById("fullName").value,
        phone: document.getElementById("phone").value,
        address: document.getElementById("address").value,
      },
      shipping_method: shippingMethod(),
      payment_method: paymentMethod(),
      items: cart.map((i) => ({ product_id: i.product_id, quantity: i.quantity })),
    });
    clearCart();
    document.getElementById("cart-view").classList.add("hidden");
    const sv = document.getElementById("success-view");
    sv.classList.remove("hidden");
    sv.classList.add("flex");
    document.getElementById("result-order-no").textContent = result.order_no;
    document.getElementById("result-subtotal").textContent = formatPrice(result.subtotal);
    document.getElementById("result-shipping").textContent = formatPrice(result.shipping_fee);
    document.getElementById("result-total").textContent = formatPrice(result.total);
    const note = document.getElementById("payment-note");
    if (result.payment && result.payment.mock) {
      note.textContent = "※ 金流尚未正式串接,目前為模擬模式。正式環境將於此導向金流公司付款頁面。";
      const mockBtn = document.getElementById("mock-pay-btn");
      mockBtn.classList.remove("hidden");
      mockBtn.addEventListener("click", async () => {
        try {
          await apiPost("/payment/mock-pay", { order_no: result.order_no });
          showToast("付款完成!訂單狀態已更新為已付款");
          mockBtn.classList.add("hidden");
        } catch (err) { showToast("模擬付款失敗:" + err.message); }
      }, { once: true });
    } else if (result.payment && result.payment.payment_url) {
      note.textContent = "即將導向金流付款頁面...";
      window.location.href = result.payment.payment_url;
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove("hidden");
  } finally {
    btn.disabled = false;
    btn.classList.remove("opacity-75");
  }
});

renderCart();
</script></body></html>
