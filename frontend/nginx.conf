# 前台靜態站台:網站根目錄為 /srv,底下有 frontend/ 與 assets/
# (HTML 以 ../assets/... 取圖、DB 圖片欄位是 /assets/...,兩者都需要此結構)
server {
    listen 8080;
    server_name _;
    charset utf-8;

    root /srv;
    index index.html;

    # Docker 內建 DNS,讓 backend 容器晚啟動時 nginx 仍能正常開機
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 進站導向前台首頁
    location = / {
        return 302 /frontend/index.html;
    }

    # 後端 API 反向代理 (前端 JS 的 API_BASE 若改為 "/api" 即可走同源,免 CORS)
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    # 商品圖與後台上傳圖 (與 backend 共用 assets 掛載)
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
