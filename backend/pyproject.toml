[project]
name = "meishifu-backend"
version = "0.1.0"
description = "美師傅購物網站後端 API (Flask)"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "pymysql>=1.1",
    "pysocks>=1.7.1",
    "python-dotenv>=1.0",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "dbutils>=3.1",
    "google-cloud-storage>=3.0",
    "google-cloud-tasks>=2.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "init_db.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
